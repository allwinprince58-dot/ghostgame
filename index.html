<!DOCTYPE html>
<html>
<head>
  <title>ghostgame</title>
  <style>
    body {
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    #lock, #chatbox {
      max-width: 400px;
      margin: auto;
      margin-top: 100px;
      padding: 20px;
      border: 1px solid #222;
      border-radius: 10px;
      background: #050505;
    }
    input, button {
      padding: 10px;
      margin: 5px;
      border-radius: 5px;
      border: none;
      width: 90%;
      background: #111;
      color: white;
    }
    button {
      background: #ff0055;
      cursor: pointer;
    }
    #chat {
      height: 250px;
      overflow-y: scroll;
      border: 1px solid #222;
      padding: 10px;
      margin-bottom: 5px;
      background: #000;
      text-align: left;
    }
    #typing {
      font-size: 12px;
      color: #777;
      height: 15px;
    }
  </style>
</head>
<body>

<div id="lock">
  <h2>👻 ghostroom</h2>
  <input id="pass" type="password" placeholder="Enter password..." />
  <button onclick="unlock()">Unlock</button>
</div>

<div id="chatbox" style="display:none;">
  <h2>👻 ghostroom</h2>
  <div id="chat"></div>
  <div id="typing"></div>
  <input id="msg" placeholder="Type your message..." oninput="sendTyping()" />
  <button onclick="send()">Send</button>
</div>

<script>
const SECRET = "foreverus"; // PASSWORD
const DELETE_TIME = 60000; // 2 minutes in milliseconds

let room = window.location.search || "?nightride";
let channel = new BroadcastChannel(room);
let typingTimeout;

function unlock() {
  let p = document.getElementById("pass").value;
  if (p === SECRET) {
    document.getElementById("lock").style.display = "none";
    document.getElementById("chatbox").style.display = "block";
  } else {
    alert("❌ Wrong Password");
  }
}

channel.onmessage = (e) => {
  let data = e.data;

  if (data.type === "typing") {
    showTyping();
    return;
  }

  let chat = document.getElementById("chat");
  let msgDiv = document.createElement("div");
  msgDiv.innerText = "💬 " + data.text;
  chat.appendChild(msgDiv);
  chat.scrollTop = chat.scrollHeight;

  // Auto delete after 2 minutes
  setTimeout(() => {
    msgDiv.remove();
  }, DELETE_TIME);
};

function send() {
  let msg = document.getElementById("msg");
  if (msg.value.trim() !== "") {
    channel.postMessage({ type: "msg", text: msg.value });
    msg.value = "";
  }
}

function sendTyping() {
  channel.postMessage({ type: "typing" });
}

function showTyping() {
  let typing = document.getElementById("typing");
  typing.innerText = "Someone is typing...";
  clearTimeout(typingTimeout);
  typingTimeout = setTimeout(() => {
    typing.innerText = "";
  }, 1000);
}
</script>

</body>
</html>
